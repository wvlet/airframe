buildRoots = [
  ".",
  "airspec",
  "sbt-airframe",
  "examples/rx-demo/gallery",
  "examples/rpc-examples/hello-rpc",
  "examples/rpc-examples/rpc-scalajs"
]

pullRequests.includeMatchedLabels = ".*-update"

updates.pin  = [ 
  # logback-core 1.3.x needs to be used for suporting Java8
  { groupId = "ch.qos.logback", artifactId="logback-core", version = "1.3." },
  # Stick to Scala 3.3.x (LTS) versions
  { groupId = "org.scala-lang", artifactId="scala3-compiler", version = "3.3." },
  { groupId = "org.scala-lang", artifactId="scala3-library", version = "3.3." },
  { groupId = "org.scala-lang", artifactId="scala3-library_sjs1", version = "3.3." },
  { groupId = "org.scala-lang", artifactId="scala3-library_sjs1_3", version = "3.3." }
]

updates.ignore = [
  # sbt 2.0.9 and 2.0.10 intermittently deadlock the task scheduler (all workers idle,
  # main thread waiting forever), which hangs CI until the 6h timeout. 2.0.8 works.
  { groupId = "org.scala-sbt", artifactId = "sbt", version = { exact = "2.0.9" } },
  { groupId = "org.scala-sbt", artifactId = "sbt", version = { exact = "2.0.10" } },
  # 2.0.11 still hangs the Scala 2.12/2.13 CI jobs until the 6h timeout
  { groupId = "org.scala-sbt", artifactId = "sbt", version = { exact = "2.0.11" } },
  # Since Scala 3.8, the Scala 3 stdlib is published as scala-library 3.x, which is not an update for Scala 2.x
  { groupId = "org.scala-lang", artifactId = "scala-library", version = { prefix = "3." } }
]

dependencyOverrides = [
  {
    dependency = { groupId = "com.chatwork", artifactId = "scala-ulid" },
    pullRequests = { frequency = "90 days" }
  },
  {
    dependency = { groupId = "software.amazon.awssdk" },
    pullRequests = { frequency = "90 days" }
  }
]
